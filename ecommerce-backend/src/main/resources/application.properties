spring.application.name=ecommerce-backend

#MySql Database

spring.datasource.url=${ECOMMERCE_DB_URL}
spring.datasource.username=${ECOMMERCE_DB_USERNAME}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true


#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE



# Logging Configuration

# Default application log level
logging.level.root=INFO

# Application logs
logging.level.com.akbar.ecommerce_backend=INFO

# Hibernate SQL and parameter binding logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF

# SQL formatting
spring.jpa.properties.hibernate.format_sql=true




#Jwt

#   3600000 = 1 hour

jwt.secret=${ECOMMERCE_JWT_SECRET}
jwt.expiration= 3600000

# Refresh token expiration in days

jwt.refresh-token-expiration-days=30



# REDIS

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# REDIS CACHE CONFIGURATION

# Default TTL for Product and Category cache
app.cache.default-ttl=10m


# RATE LIMIT CONFIGURATION

# Login API
app.rate-limit.login.max-requests=10
app.rate-limit.login.window=1m


# Refresh Token API
app.rate-limit.refresh.max-requests=10
app.rate-limit.refresh.window=1m


# User Registration API
app.rate-limit.register.max-requests=5
app.rate-limit.register.window=1m
