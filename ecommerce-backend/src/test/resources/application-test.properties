spring.application.name=ecommerce-backend-test

# Test MySQL Database
spring.datasource.url=${ECOMMERCE_TEST_DB_URL:jdbc:mysql://localhost:3306/ecommerce_backend_test}
spring.datasource.username=${ECOMMERCE_TEST_DB_USERNAME:root}
spring.datasource.password=${ECOMMERCE_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true



# Logging
logging.level.root=INFO
logging.level.com.akbar.ecommerce_backend=INFO

# Hibernate SQL and parameter binding
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF



# Test Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${ECOMMERCE_TEST_JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-token-expiration-days=30

# Cache
app.cache.default-ttl=10m

# Rate Limit
app.rate-limit.login.max-requests=1000
app.rate-limit.login.window=1m

app.rate-limit.refresh.max-requests=1000
app.rate-limit.refresh.window=1m

app.rate-limit.register.max-requests=1000
app.rate-limit.register.window=1m